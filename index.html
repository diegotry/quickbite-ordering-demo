<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickBite Orders</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">QuickBite</p>
      <h1>Lunch, one click away</h1>
      <p class="description">Margherita pizza · side salad · sparkling water</p>
      <div class="order-row">
        <strong>$18.00</strong>
        <button id="place-order" type="button">Place order</button>
      </div>
      <p id="confirmation" class="confirmation" role="status" aria-live="polite"></p>
    </main>
    <section class="card report" aria-labelledby="report-title">
      <h2 id="report-title">Button not working?</h2>
      <p class="description">
        Report it. An AI agent finds the fix, and Diego approves it. No login
        needed.
      </p>
      <button id="report-bug" class="report-button" type="button">
        Report this bug
      </button>
      <div id="report-status" class="report-status" role="status" aria-live="polite"></div>
    </section>
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="./src/report.js"></script>
  </body>
</html>
